[package]
name = "jelly"
version = "0.1.0"
description = "Ein kleiner Desktop-Begleiter für die LAN am Umwelt-Campus Birkenfeld"
edition = "2021"
rust-version = "1.85"

[lib]
name = "jelly_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
