name: Server Image

# Forgejo only: when .forgejo/workflows exists, Forgejo ignores .github/workflows,
# and GitHub never reads this directory.
on:
  push:
    tags:
      - "server-v*"

env:
  REGISTRY: forge.stash.deadpostbox.net
  IMAGE: forge.stash.deadpostbox.net/tomek/jelly-server

jobs:
  image:
    runs-on: docker
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A tag event does not know its branch, so only tags on main or on the release branch of
      # their minor version are built: a backport server-v1.41.6 lives on release/1.41.
      - name: Require tagged commit on main or its release branch
        run: |
          set -eu
          VERSION="${GITHUB_REF_NAME#server-v}"
          RELEASE_BRANCH="release/${VERSION%.*}"
          git fetch origin main
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag $GITHUB_REF_NAME is on main."
            exit 0
          fi
          if git fetch origin "$RELEASE_BRANCH" 2>/dev/null \
            && git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "Tag $GITHUB_REF_NAME is on $RELEASE_BRANCH."
            exit 0
          fi
          echo "Tag $GITHUB_REF_NAME is neither on main nor on $RELEASE_BRANCH, skipping."
          exit 1

      # The image is named after the tag, and /version reports APIVersion, so both must match.
      - name: Require tag to match APIVersion
        run: |
          set -eu
          TAG_VERSION="${GITHUB_REF_NAME#server-v}"
          API_VERSION="$(sed -n 's/^[[:space:]]*APIVersion = "\(.*\)"$/\1/p' apps/server/internal/api/openapi.go)"
          if [ -z "$API_VERSION" ]; then
            echo "APIVersion not found in apps/server/internal/api/openapi.go."
            exit 1
          fi
          if [ "$TAG_VERSION" != "$API_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match APIVersion $API_VERSION, tag server-v$API_VERSION instead."
            exit 1
          fi

      # The job image has no docker CLI, only the DinD daemon is reachable.
      # buildx is needed because the Dockerfile uses BuildKit cache mounts.
      - name: Install docker CLI and buildx
        run: |
          set -eu
          curl -fsSL https://download.docker.com/linux/static/stable/x86_64/docker-27.5.1.tgz \
            | tar -xz --strip-components=1 -C /usr/local/bin docker/docker
          mkdir -p "$HOME/.docker/cli-plugins"
          curl -fsSL -o "$HOME/.docker/cli-plugins/docker-buildx" \
            https://github.com/docker/buildx/releases/download/v0.19.3/buildx-v0.19.3.linux-amd64
          chmod +x "$HOME/.docker/cli-plugins/docker-buildx"
          docker version
          docker buildx version

      - name: Log in to the registry
        run: echo "${{ secrets.REGISTRY_TOKEN }}" | docker login "$REGISTRY" -u "${{ github.repository_owner }}" --password-stdin

      # A backport to an older version must not move latest back, so only the highest version
      # of all server tags gets it.
      - name: Decide whether latest moves
        run: |
          set -eu
          VERSION="${GITHUB_REF_NAME#server-v}"
          HIGHEST="$(git tag --list 'server-v*' | sed 's/^server-v//' | sort -V | tail -n 1)"
          if [ "$VERSION" = "$HIGHEST" ]; then
            echo "Version $VERSION is the highest, latest moves to it."
            echo "IMAGE_TAGS=-t $IMAGE:$VERSION -t $IMAGE:latest" >> "$GITHUB_ENV"
            echo "MOVES_LATEST=true" >> "$GITHUB_ENV"
          else
            echo "Version $VERSION is below $HIGHEST, latest stays."
            echo "IMAGE_TAGS=-t $IMAGE:$VERSION" >> "$GITHUB_ENV"
            echo "MOVES_LATEST=false" >> "$GITHUB_ENV"
          fi

      - name: Build and push
        run: |
          VERSION="${GITHUB_REF_NAME#server-v}"
          # IMAGE_TAGS holds several arguments, so it stays unquoted.
          # shellcheck disable=SC2086
          docker buildx build --platform linux/amd64 --push -f apps/server/Dockerfile \
            --build-arg "SERVER_VERSION=$VERSION" --build-arg "SERVER_REVISION=$GITHUB_SHA" \
            $IMAGE_TAGS \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.version=$VERSION" .

      # The stack runs :latest, so only an image that moved latest is deployed. The Komodo webhook
      # checks a GitHub-style signature and the branch in the body.
      - name: Redeploy the server
        if: env.MOVES_LATEST == 'true'
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
          DEPLOY_WEBHOOK_SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}
        run: |
          set -eu
          if [ -z "$DEPLOY_WEBHOOK_URL" ]; then
            echo "::warning::DEPLOY_WEBHOOK_URL is not set, the server has to be redeployed by hand."
            exit 0
          fi
          BODY='{"ref":"refs/heads/main"}'
          SIGNATURE=""
          if [ -n "$DEPLOY_WEBHOOK_SECRET" ]; then
            SIGNATURE="sha256=$(printf '%s' "$BODY" | openssl dgst -sha256 -hmac "$DEPLOY_WEBHOOK_SECRET" -r | cut -d' ' -f1)"
          fi
          curl -fsS --max-time 30 -X POST "$DEPLOY_WEBHOOK_URL" \
            -H "Content-Type: application/json" -H "X-GitHub-Event: push" \
            -H "X-Hub-Signature-256: $SIGNATURE" -d "$BODY" -o /dev/null
          echo "Redeploy of the server requested."
